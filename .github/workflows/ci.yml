name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run Vitest test suite
        run: npm test
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"ci-test"}'
          GEMINI_API_KEY: 'ci-placeholder-gemini-api-key-00000'
          SMTP_HOST: 'smtp.ci.local'
          SMTP_PORT: '587'
          SMTP_USER: 'ci@ci.local'
          SMTP_PASS: 'ci-secret-pass'
          SESSION_SECRET: 'ci-session-secret-at-least-32-chars-long!!'
          CRON_SECRET: 'ci-cron-secret-min-16'
          TOKEN_SECRET: 'ci-token-secret-at-least-32-chars-long!!'
          APP_URL: 'http://localhost:3000'
